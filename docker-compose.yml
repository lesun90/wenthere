services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wenthere:wenthere@db:5432/wenthere
      STORAGE_ENDPOINT: http://storage:9000
      NEXT_PUBLIC_STORAGE_PUBLIC_URL: http://localhost:9000/photos
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wenthere
      POSTGRES_USER: wenthere
      POSTGRES_PASSWORD: wenthere
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenthere -d wenthere"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wenthere
      MINIO_ROOT_PASSWORD: wenthere123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://storage:9000 wenthere wenthere123 &&
        mc mb --ignore-existing local/photos &&
        mc anonymous set public local/photos &&
        echo 'Storage bucket ready.'
      "

volumes:
  postgres_data:
  minio_data:
