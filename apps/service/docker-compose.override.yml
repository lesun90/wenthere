services:
  app:
    build:
      target: dev
    volumes:
      - ../..:/app
      - root_node_modules:/app/node_modules
      - service_node_modules:/app/apps/service/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - storage_cloud_node_modules:/app/packages/storage-cloud/node_modules
      - service_next:/app/apps/service/.next
    ports:
      - "9230:9230"
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --inspect=0.0.0.0:9230
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}

volumes:
  root_node_modules:
  service_node_modules:
  ui_node_modules:
  storage_cloud_node_modules:
  service_next:
