services:
  app:
    build:
      target: dev
    volumes:
      - ../..:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - ui_node_modules:/app/packages/ui/node_modules
      - storage_local_node_modules:/app/packages/storage-local/node_modules
      - storage_github_node_modules:/app/packages/storage-github/node_modules
      - storage_supabase_node_modules:/app/packages/storage-supabase/node_modules
      - web_next:/app/apps/web/.next
    ports:
      - "9229:9229"
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --inspect=0.0.0.0:9229
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_STORAGE_REPO: ${GITHUB_STORAGE_REPO:-}
      GITHUB_OWNER_SECRET: ${GITHUB_OWNER_SECRET:-}

volumes:
  root_node_modules:
  web_node_modules:
  ui_node_modules:
  storage_local_node_modules:
  storage_github_node_modules:
  storage_supabase_node_modules:
  web_next:
