services:
  app:
    image: node:20-alpine
    working_dir: /app
    # npm install runs on first start; node_modules persist in a named volume
    command: sh scripts/dev.sh
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules   # container-side modules, not host's
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wenthere:wenthere@db:5432/wenthere
      STORAGE_ENDPOINT: http://storage:9000
      NEXT_PUBLIC_STORAGE_PUBLIC_URL: http://localhost:9000/photos
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  app_node_modules:
